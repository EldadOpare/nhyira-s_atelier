<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" ry="7" fill="#ffffff"/>

  <!-- Thin gold inset border -->
  <rect x="2.5" y="2.5" width="27" height="27" rx="5.5" ry="5.5" fill="none" stroke="#0A4F4F" stroke-width="0.6" opacity="0.55"/>

  <!-- Stylised "N" — three clean strokes, slightly italic feel -->
  <!-- Left vertical -->
  <line x1="8.5" y1="8" x2="8.5" y2="24" stroke="#0A4F4F" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Diagonal -->
  <line x1="8.5" y1="8" x2="23.5" y2="24" stroke="#0A4F4F" stroke-width="1.7" stroke-linecap="round"/>
  <!-- Right vertical -->
  <line x1="23.5" y1="8" x2="23.5" y2="24" stroke="#0A4F4F" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Tiny gold accent dot -->
  <circle cx="27" cy="27" r="1.1" fill="#C9A84C" opacity="0.65"/>
</svg>
